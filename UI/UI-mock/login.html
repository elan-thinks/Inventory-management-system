<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaTech IMS — Login</title>
<style>
:root{
  --primary:#1E4B8F; --primary-hover:#163A6E; --secondary:#3B7A8F;
  --bg:#F4F6F8; --surface:#FFFFFF;
  --text:#1F2933; --text-muted:#6B7785;
  --success:#2E8B57; --success-tint:#E4F3EA;
  --warning:#C77700; --warning-tint:#FBEBD9;
  --error:#C0392B; --error-tint:#FBEAE8;
  --info:#2E6E9E; --info-tint:#E7F0F7;
  --border:#D7DCE1; --border-focus:#1E4B8F;
  --disabled-bg:#ECEEF1; --disabled-text:#9AA5B1;
  --row-hover:#EAF1F8; --row-selected:#D6E4F5;
  --radius-sm:4px; --radius-lg:6px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;
  --font: "Segoe UI", Tahoma, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); color:var(--text); background:var(--bg);
  font-size:12px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.icon-wrap{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
.icon-wrap .icon{display:block; width:100%; height:100%;}

/* ---------- App shell ---------- */
.app{ display:flex; width:100%; min-width:1024px; min-height:768px; height:100vh; background:var(--bg); overflow:hidden;}
.sidebar{
  width:220px; flex:0 0 220px; background:#16324F; color:#E4EAF1;
  display:flex; flex-direction:column; height:100%;
}
.sidebar-brand{
  display:flex; align-items:center; gap:var(--sp-2);
  padding:18px var(--sp-4); border-bottom:1px solid rgba(255,255,255,0.10);
  font-size:14px; font-weight:600; color:#FFFFFF; letter-spacing:.2px;
}
.sidebar-brand .icon-wrap{color:#7FA8D9;}
.sidebar-group-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.6px;
  color:#8DA3BE; padding:var(--sp-4) var(--sp-4) 6px;
}
.sidebar nav{flex:1; overflow-y:auto; padding-bottom:var(--sp-4);}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px var(--sp-4);
  margin:1px var(--sp-2); border-radius:var(--radius-sm);
  color:#C7D3E0; text-decoration:none; font-size:12.5px; cursor:pointer;
  border-left:3px solid transparent;
}
.nav-item .icon-wrap{color:#8DA3BE;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{
  background:rgba(255,255,255,0.12); color:#FFFFFF; font-weight:600;
  border-left:3px solid #5B9BD5; margin-left:0; padding-left:13px;
}
.nav-item.active .icon-wrap{color:#5B9BD5;}
.sidebar-footer{
  border-top:1px solid rgba(255,255,255,0.10); padding:var(--sp-3) var(--sp-4);
  display:flex; align-items:center; gap:8px; font-size:11px; color:#9FB1C6;
}

.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%;}
.header{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px var(--sp-6); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
  flex:0 0 auto;
}
.header-titles{min-width:0;}
.breadcrumb{font-size:11px; color:var(--text-muted); margin-bottom:2px;}
.screen-title{font-size:20px; font-weight:600; color:var(--text); margin:0; line-height:1.2;}
.header-right{display:flex; align-items:center; gap:var(--sp-3); flex-shrink:0;}
.global-search{
  display:flex; align-items:center; gap:6px; background:var(--bg);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:7px 10px; width:230px; color:var(--text-muted); font-size:11.5px;
}
.global-search .icon-wrap{color:var(--text-muted);}
.role-switcher{
  display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted);
  border:1px dashed var(--border); border-radius:var(--radius-sm); padding:6px 9px; background:#FCFCFD;
}
.role-switcher select{
  font-family:var(--font); font-size:11.5px; border:none; background:transparent; color:var(--text);
  font-weight:600;
}

.content{flex:1; overflow-y:auto; padding:var(--sp-6);}
.content-narrow{max-width:760px;}

.statusbar{
  flex:0 0 auto; background:#EEF1F4; border-top:1px solid var(--border);
  padding:6px var(--sp-6); display:flex; align-items:center; justify-content:space-between;
  font-size:10.5px; color:var(--text-muted);
}
.statusbar-left{display:flex; align-items:center; gap:var(--sp-4);}
.statusbar-msg{display:flex; align-items:center; gap:6px; color:var(--success); font-weight:600;}

/* ---------- Typography ---------- */
h1,h2,h3{margin:0; font-weight:600; color:var(--text);}
.section-title{font-size:15px; font-weight:600; margin:0 0 var(--sp-3);}
.helper-text{font-size:11px; color:var(--text-muted);}
.error-text{font-size:11px; color:var(--error);}
.required:after{content:" *"; color:var(--error);}

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--font); font-size:12px; font-weight:600; border-radius:var(--radius-sm);
  padding:9px 16px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  border:1px solid transparent; line-height:1;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-hover);}
.btn-secondary{background:#fff; color:var(--primary); border-color:var(--primary);}
.btn-secondary:hover{background:#F1F6FC;}
.btn-danger{background:var(--error); color:#fff;}
.btn-danger:hover{background:#A5301F;}
.btn-ghost{background:transparent; color:var(--primary); border-color:transparent; padding:9px 8px;}
.btn-ghost:hover{text-decoration:underline;}
.btn-disabled, .btn[disabled]{background:var(--disabled-bg); color:var(--disabled-text); border-color:var(--disabled-bg); cursor:not-allowed;}
.btn-sm{padding:6px 11px; font-size:11.5px;}

/* ---------- Cards / panels ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); }
.panel-header{padding:14px var(--sp-4); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.panel-body{padding:var(--sp-4);}

/* ---------- Forms ---------- */
.field-group{margin-bottom:var(--sp-4);}
.field-row{display:flex; gap:var(--sp-4);}
.field{flex:1; margin-bottom:var(--sp-4);}
.field label{display:block; font-size:11px; color:var(--text); font-weight:600; margin-bottom:6px;}
.field .helper-text{margin-top:4px;}
.field .error-text{margin-top:4px; display:flex; align-items:center; gap:5px;}
input[type=text], input[type=password], input[type=number], input[type=date], textarea, select.select{
  width:100%; font-family:var(--font); font-size:12px; color:var(--text);
  border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff;
  padding:9px 10px;
}
textarea{resize:none; min-height:64px;}
input:focus, textarea:focus, select:focus{outline:none; border:2px solid var(--border-focus); padding:8px 9px;}
.field.error input, .field.error textarea{border:2px solid var(--error); padding:8px 9px;}
.field.disabled input, input[disabled]{background:var(--disabled-bg); color:var(--disabled-text); border-color:var(--border);}
.select-wrap{position:relative;}
.select-wrap .icon-wrap{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none;}
.form-section{border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--sp-4) var(--sp-4) var(--sp-1); margin-bottom:var(--sp-4); background:#FCFDFE;}
.form-section .section-title{font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--secondary); margin-bottom:var(--sp-4);}
.form-actions{display:flex; justify-content:flex-end; gap:var(--sp-3); padding-top:var(--sp-4); border-top:1px solid var(--border); margin-top:var(--sp-2);}
.form-actions.split{justify-content:space-between;}

/* ---------- Badges / pills ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:11px; font-size:11px; font-weight:600; white-space:nowrap;}
.badge .icon-wrap{opacity:.9;}
.badge-success{background:var(--success-tint); color:var(--success);}
.badge-warning{background:var(--warning-tint); color:var(--warning);}
.badge-error{background:var(--error-tint); color:var(--error);}
.badge-muted{background:var(--disabled-bg); color:var(--disabled-text);}
.badge-info{background:var(--info-tint); color:var(--info);}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-4); flex-wrap:wrap;}
.search-input{display:flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 11px; flex:1; min-width:220px; max-width:320px;}
.search-input input{border:none; padding:0; font-size:12px; width:100%;}
.search-input input:focus{border:none; padding:0;}
.search-input .icon-wrap{color:var(--text-muted);}
.filter-select{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; font-size:11.5px; color:var(--text); min-width:140px;}
.filter-select .icon-wrap{color:var(--text-muted); margin-left:auto;}
.clear-filters{color:var(--primary); font-size:11.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px;}
.result-count{font-size:11px; color:var(--text-muted); margin-bottom:var(--sp-2);}

/* ---------- Table / DataGridView ---------- */
table.grid{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;}
table.grid thead th{
  background:var(--bg); color:var(--text); font-size:11px; font-weight:600; text-align:left;
  padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer;
}
table.grid thead th .icon-wrap{color:var(--text-muted); margin-left:4px; vertical-align:middle;}
table.grid tbody td{padding:9px 12px; font-size:11.5px; border-bottom:1px solid #EEF1F4; vertical-align:middle;}
table.grid tbody tr:nth-child(even){background:#FAFBFC;}
table.grid tbody tr:hover{background:var(--row-hover);}
table.grid tbody tr.selected{background:var(--row-selected); box-shadow:inset 3px 0 0 var(--primary);}
table.grid tbody tr:last-child td{border-bottom:none;}
td.num{text-align:right; font-variant-numeric:tabular-nums;}
td.currency{text-align:right; font-variant-numeric:tabular-nums;}
.row-actions{display:flex; gap:10px; justify-content:flex-end; color:var(--text-muted);}
.row-actions .icon-wrap{cursor:pointer;}
.row-actions .icon-wrap:hover{color:var(--primary);}
.row-actions .icon-wrap.danger:hover{color:var(--error);}
.grid-footer{display:flex; justify-content:space-between; align-items:center; padding:var(--sp-2) 2px; font-size:11px; color:var(--text-muted);}

/* ---------- Metric tiles ---------- */
.metric-row{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--sp-4); margin-bottom:var(--sp-6);}
.metric-tile{background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--sp-4);}
.metric-label{font-size:11px; color:var(--text-muted); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.metric-value{font-size:24px; font-weight:600; color:var(--text); line-height:1;}
.metric-tile.alert .metric-value{color:var(--warning);}
.metric-tile.critical .metric-value{color:var(--error);}

/* ---------- Dialog / modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(20,30,40,0.42); display:flex; align-items:center; justify-content:center; z-index:50;}
.modal{background:#fff; border-radius:var(--radius-lg); width:560px; max-width:92vw; box-shadow:0 8px 28px rgba(15,30,50,0.22); max-height:88vh; display:flex; flex-direction:column;}
.modal.modal-sm{width:440px;}
.modal-header{padding:var(--sp-4) var(--sp-6); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-header h2{font-size:15px;}
.modal-close{cursor:pointer; color:var(--text-muted);}
.modal-body{padding:var(--sp-6); overflow-y:auto;}
.modal-footer{padding:var(--sp-4) var(--sp-6); border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:var(--sp-3);}

/* ---------- Confirmation dialog specific ---------- */
.confirm-icon{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.confirm-icon.warn{background:var(--warning-tint); color:var(--warning);}
.confirm-icon.danger{background:var(--error-tint); color:var(--error);}
.confirm-icon.info{background:var(--info-tint); color:var(--info);}
.confirm-body{display:flex; gap:var(--sp-4);}
.confirm-body p{margin:6px 0 0; color:var(--text-muted); font-size:12px; line-height:1.5;}
.confirm-body .facts{margin-top:10px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:11.5px;}
.confirm-body .facts div{display:flex; justify-content:space-between; padding:2px 0;}

/* ---------- Empty state ---------- */
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:56px var(--sp-6); color:var(--text-muted);}
.empty-state .icon-wrap{color:var(--border); margin-bottom:var(--sp-3);}
.empty-state h3{font-size:13px; color:var(--text); margin-bottom:6px; font-weight:600;}
.empty-state p{margin:0 0 var(--sp-4); font-size:11.5px; max-width:360px;}

/* ---------- Toast / status message ---------- */
.toast{
  display:inline-flex; align-items:center; gap:8px; background:var(--success-tint); color:var(--success);
  border:1px solid #BFE3CC; border-radius:var(--radius-sm); padding:9px 14px; font-size:11.5px; font-weight:600;
}
.toast.warn{background:var(--warning-tint); color:var(--warning); border-color:#F0D3A6;}
.toast.error{background:var(--error-tint); color:var(--error); border-color:#EEC1BA;}
.toast.info{background:var(--info-tint); color:var(--info); border-color:#C4DAEA;}
.banner{display:flex; align-items:flex-start; gap:10px; border-radius:var(--radius-sm); padding:11px 14px; font-size:11.5px; margin-bottom:var(--sp-4); border:1px solid transparent;}
.banner.warn{background:var(--warning-tint); color:#8A5600; border-color:#F0D3A6;}
.banner.info{background:var(--info-tint); color:#1D4E6E; border-color:#C4DAEA;}
.banner.error{background:var(--error-tint); color:#8E291B; border-color:#EEC1BA;}
.banner b{font-weight:700;}

/* ---------- role visibility ---------- */
[data-admin-only]{}
body[data-role="staff"] [data-admin-only]{display:none !important;}
body[data-role="staff"] [data-staff-note]{display:inline-flex !important;}
[data-staff-note]{display:none;}

/* ---------- misc ---------- */
.two-col{display:grid; grid-template-columns:1.6fr 1fr; gap:var(--sp-6);}
.divider{height:1px; background:var(--border); margin:var(--sp-4) 0;}
.tag-pill{display:inline-flex; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:3px 10px; font-size:11px; color:var(--text-muted);}
.mockup-frame-label{
  position:fixed; top:8px; left:8px; background:#16324F; color:#fff; font-size:10px; font-weight:600;
  padding:4px 9px; border-radius:3px; z-index:100; font-family:var(--font); letter-spacing:.3px; opacity:.85;
}

.login-wrap{width:100%; min-width:1024px; min-height:768px; height:100vh; background:var(--bg);
  display:flex; align-items:center; justify-content:center;}
.login-card{width:380px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:var(--sp-8) var(--sp-6) var(--sp-6); box-shadow:0 1px 3px rgba(15,30,50,0.06);}
.login-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:var(--sp-6);}
.login-logo .mark{width:52px; height:52px; border-radius:12px; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center;}
.login-logo h1{font-size:16px; font-weight:600;}
.login-logo p{font-size:11px; color:var(--text-muted); margin:0;}
.login-field{margin-bottom:var(--sp-4);}
.login-field label{display:block; font-size:11px; font-weight:600; margin-bottom:6px;}
.input-icon{position:relative;}
.input-icon .icon-wrap{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted);}
.input-icon input{padding-left:34px;}
.login-error{display:flex; align-items:center; gap:8px; background:var(--error-tint); color:var(--error);
  border:1px solid #EEC1BA; border-radius:var(--radius-sm); padding:9px 11px; font-size:11.5px; margin-bottom:var(--sp-4);}
.login-btn{width:100%; justify-content:center; padding:10px 16px; font-size:12.5px;}
.login-footer{text-align:center; margin-top:var(--sp-6); font-size:10.5px; color:var(--disabled-text);}
</style>
</head>
<body>
<div class="mockup-frame-label">SCR-001 · Login — Normal / Error state shown</div>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark"><span class="icon-wrap " style="width:28px;height:28px;"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/></svg></span></div>
      <h1>NovaTech Electronics</h1>
      <p>Inventory Management System</p>
    </div>

    <div class="login-error"><span class="icon-wrap " style="width:16px;height:16px;"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></span><span>Invalid username or password.</span></div>

    <div class="login-field">
      <label>Username</label>
      <div class="input-icon"><span class="icon-wrap " style="width:16px;height:16px;"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><input type="text" placeholder="e.g. a.mekonnen" value=""></div>
    </div>
    <div class="login-field">
      <label>Password</label>
      <div class="input-icon"><span class="icon-wrap " style="width:16px;height:16px;"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="1.5"/><path d="M7.5 10.5V7a4.5 4.5 0 019 0v3.5"/></svg></span><input type="password" placeholder="Enter your password" value=""></div>
    </div>

    <button class="btn btn-primary login-btn">Login</button>
    <div class="login-footer">NovaTech IMS · v1.0 · Internal use only</div>
  </div>
</div>
</body>
</html>
